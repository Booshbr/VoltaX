name: Signal alerts (cloud cron)

# Triggers VoltaX qualified-signal Telegram alerts every 5 minutes, independent
# of any open browser — a free alternative to a Vercel Pro cron. The endpoint
# de-duplicates in Supabase, so repeated hits never spam the same signal.
#
# IMPORTANT: GitHub only runs scheduled workflows on the repository's DEFAULT
# branch. Make sure the default branch is `master` (Settings > Branches).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: alerts-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the alerts endpoint
        env:
          # Add this under Settings > Secrets and variables > Actions, using the
          # SAME value as the CRON_SECRET environment variable set on Vercel.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set."
            exit 1
          fi
          # Secret is sent as a Bearer header (not in the URL) so it never lands in logs.
          curl -sS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://volta-x.vercel.app/api/cron/alerts" \
            -w "\nHTTP %{http_code}\n"
